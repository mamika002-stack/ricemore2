<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RiceMore | Gelir Gider Yönetimi</title>
<style>
  :root{
    --bg:#12201A; --bg-elev:#182A22; --panel:#1E332A; --panel-2:#233A2F;
    --border:#2C4238; --text:#F3EEDF; --text-dim:#AEBBB0; --text-faint:#7E8C82;
    --accent:#D9A441; --accent-ink:#2A1E08; --accent-soft:rgba(217,164,65,.16);
    --income:#8FB996; --income-soft:rgba(143,185,150,.16);
    --expense:#E2725B; --expense-soft:rgba(226,114,91,.16);
    --info:#6FA8DC; --radius:10px; --radius-lg:16px;
    --shadow:0 8px 24px rgba(0,0,0,.35);
    --font-display: Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-num:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;
  }
  body[data-theme="light"]{
    --bg:#F6F1E4; --bg-elev:#FFFFFF; --panel:#FFFFFF; --panel-2:#FBF7EC;
    --border:#E3D9BE; --text:#231C11; --text-dim:#5B5340; --text-faint:#8A8069;
    --accent:#B27B22; --accent-ink:#FFFFFF; --accent-soft:rgba(178,123,34,.12);
    --income:#3F7A4C; --income-soft:rgba(63,122,76,.12);
    --expense:#B5453A; --expense-soft:rgba(181,69,58,.10);
    --info:#2C6FA8; --shadow:0 8px 24px rgba(60,45,10,.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }
  button,input,select,textarea{font-family:inherit;color:inherit;}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}

  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:236px;flex:none;background:var(--bg-elev);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 20px 8px;}
  .brand .grain{width:10px;height:10px;border-radius:2px 8px 2px 8px;background:var(--accent);flex:none;}
  .brand h1{font-family:var(--font-display);font-size:22px;margin:0;letter-spacing:.3px;}
  .brand span.sub{display:block;font-size:11px;color:var(--text-faint);margin-top:2px;}
  nav.navlist{display:flex;flex-direction:column;gap:2px;flex:1;}
  .navlink{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;
    color:var(--text-dim);text-decoration:none;cursor:pointer;font-size:14px;border:none;background:none;text-align:left;width:100%;}
  .navlink svg{width:17px;height:17px;flex:none;}
  .navlink:hover{background:var(--panel-2);color:var(--text);}
  .navlink.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .sidebar-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;font-size:11px;color:var(--text-faint);line-height:1.5;}

  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:16px 26px;gap:12px;}
  .topbar h2{font-family:var(--font-display);font-size:20px;margin:0;}
  .topbar .meta{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .topbar-actions{display:flex;gap:8px;align-items:center;}
  #view-root{padding:22px 26px 60px 26px;flex:1;}

  .btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:9px 14px;
    border-radius:8px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-danger{color:var(--expense);}
  .btn-ghost{background:none;border-color:transparent;}
  .btn-ghost:hover{background:var(--panel-2);border-color:transparent;}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border);background:var(--panel);cursor:pointer;}
  .icon-btn svg{width:15px;height:15px;}
  .icon-btn:hover{border-color:var(--accent);}

  /* Cards / grid */
  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1.3fr .7fr;}
  @media (max-width:1050px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;}
  .stat-card .label{font-size:12px;color:var(--text-faint);display:flex;align-items:center;justify-content:space-between;}
  .stat-card .value{font-family:var(--font-display);font-size:26px;margin-top:8px;}
  .stat-card .sub{font-size:12px;margin-top:6px;color:var(--text-faint);}
  .stat-card.income .value{color:var(--income);}
  .stat-card.expense .value{color:var(--expense);}
  .card h3{margin:0 0 14px 0;font-size:14.5px;font-family:var(--font-display);}
  .card .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .card .card-head h3{margin:0;}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-faint);font-weight:500;font-size:11.5px;text-transform:none;
     padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel-2);}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;}
  .pill.income{background:var(--income-soft);color:var(--income);}
  .pill.expense{background:var(--expense-soft);color:var(--expense);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .empty{padding:40px 20px;text-align:center;color:var(--text-faint);}
  .empty .big{font-family:var(--font-display);font-size:17px;color:var(--text);margin-bottom:6px;}

  /* Forms */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=tel],
  .field select,.field textarea{
    width:100%;padding:10px 11px;background:var(--bg-elev);border:1px solid var(--border);
    border-radius:8px;font-size:14px;color:var(--text);}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .toggle-group{display:flex;gap:8px;}
  .toggle-opt{flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;text-align:center;
    cursor:pointer;font-size:13.5px;font-weight:600;background:var(--bg-elev);}
  .toggle-opt.sel-income{border-color:var(--income);color:var(--income);background:var(--income-soft);}
  .toggle-opt.sel-expense{border-color:var(--expense);color:var(--expense);background:var(--expense-soft);}
  .hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
  .colorline{display:flex;align-items:center;gap:10px;}
  .colorline input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elev);}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;}
  .dialog{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
    width:100%;max-width:460px;max-height:88vh;overflow:auto;box-shadow:var(--shadow);}
  .dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);}
  .dialog-head h3{margin:0;font-family:var(--font-display);font-size:18px;}
  .dialog-body{padding:20px;}
  .dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border);}

  /* Toast */
  #toast-root{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);
    padding:12px 16px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);animation:toastin .18s ease;}
  @keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* Filters bar */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
  .filters select,.filters input{padding:8px 10px;background:var(--bg-elev);border:1px solid var(--border);
    border-radius:8px;font-size:13px;color:var(--text);}
  .filters input[type=search]{min-width:180px;flex:1;}

  /* Charts */
  canvas{max-width:100%;display:block;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--text-dim);}
  .legend .li{display:flex;align-items:center;gap:6px;}

  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .tab{padding:9px 4px;margin-right:16px;color:var(--text-faint);cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;}
  .tab.active{color:var(--accent);border-color:var(--accent);font-weight:600;}

  .kv-list{display:flex;flex-direction:column;gap:10px;}
  .kv-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg-elev);
    border:1px solid var(--border);border-radius:8px;}

  .mobile-nav{display:none;}
  @media (max-width:860px){
    .sidebar{display:none;}
    .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg-elev);
      border-top:1px solid var(--border);z-index:40;padding:6px 4px;justify-content:space-around;}
    .mobile-nav button{background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;
      align-items:center;gap:2px;font-size:10px;padding:6px 2px;flex:1;}
    .mobile-nav button svg{width:18px;height:18px;}
    .mobile-nav button.active{color:var(--accent);}
    #view-root{padding:16px 14px 90px 14px;}
    .topbar{padding:14px 14px;}
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .field-row{grid-template-columns:1fr;}
    table{font-size:12.5px;}
    th:nth-child(4),td:nth-child(4){display:none;}
  }
  @media print{
    .sidebar,.topbar-actions,.mobile-nav,.filters,.row-actions,#toast-root{display:none!important;}
    body{background:#fff;color:#000;}
    .card{border:1px solid #ccc;box-shadow:none;}
  }
</style>
</head>
<body data-theme="dark">
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="grain"></span><div><h1 id="brand-name">RiceMore</h1><span class="sub">Gelir · Gider Yönetimi</span></div></div>
    <nav class="navlist" id="nav-desktop"></nav>
    <div class="sidebar-foot">Bulut Senkronizasyonu Aktif · Aile ile ortak kullanımda.</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h2 id="page-title">Gösterge Paneli</h2>
        <div class="meta" id="page-meta"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="quick-add-btn">+ Yeni İşlem</button>
      </div>
    </header>
    <main id="view-root"></main>
  </div>
</div>

<nav class="mobile-nav" id="nav-mobile"></nav>
<div id="modal-root"></div>
<div id="toast-root"></div>

<!-- Firebase SDKs and Realtime Sync -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3gqKZAfyMDR9YS-hBlC16TwyVEpz-DhA",
  authDomain: "ricemore-butce.firebaseapp.com",
  projectId: "ricemore-butce",
  storageBucket: "ricemore-butce.firebasestorage.app",
  messagingSenderId: "995416983420",
  appId: "1:995416983420:web:6dad1d11a614aa502d46f9",
  measurementId: "G-VLC2CYQCX0"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const docRef = doc(db, "ricemore", "shared_state");

const STORAGE_KEY = 'ricemore_finance_v1';

function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function defaultData(){
  return {
    settings:{ businessName:'RiceMore', theme:'dark' },
    accounts:[
      { id:uid('acc'), name:'Kasa (Nakit)', type:'nakit', opening:0 },
      { id:uid('acc'), name:'Banka Hesabı', type:'banka', opening:0 }
    ],
    categories:{
      gelir:[
        { id:uid('cat'), name:'Satış Geliri', color:'#8FB996' },
        { id:uid('cat'), name:'Toptan Satış', color:'#6FA8DC' },
        { id:uid('cat'), name:'Online Satış', color:'#D9A441' },
        { id:uid('cat'), name:'Diğer Gelir', color:'#B9A0D4' }
      ],
      gider:[
        { id:uid('cat'), name:'Hammadde / Stok', color:'#E2725B' },
        { id:uid('cat'), name:'Kira', color:'#D9A441' },
        { id:uid('cat'), name:'Personel', color:'#6FA8DC' },
        { id:uid('cat'), name:'Fatura (Elektrik/Su/Doğalgaz)', color:'#8FB996' },
        { id:uid('cat'), name:'Nakliye / Kargo', color:'#B9A0D4' },
        { id:uid('cat'), name:'Pazarlama', color:'#E29A3A' },
        { id:uid('cat'), name:'Vergi / SGK', color:'#C0645A' },
        { id:uid('cat'), name:'Ekipman / Bakım', color:'#7C9C8E' },
        { id:uid('cat'), name:'Diğer Gider', color:'#9AA0A6' }
      ]
    },
    contacts:[],
    transactions:[],
    recurring:[]
  };
}

window.state = loadLocalState();
function loadLocalState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.accounts) return parsed; }
  }catch(e){}
  return defaultData();
}

window.saveState = function(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(window.state));
  setDoc(docRef, window.state).catch(err => console.error("Bulut kayıt hatası:", err));
};

// Realtime cloud sync listener
onSnapshot(docRef, (docSnap) => {
  if (docSnap.exists()) {
    window.state = docSnap.data();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(window.state));
  } else {
    setDoc(docRef, window.state);
  }
  if(typeof applyBrand === 'function') applyBrand();
  if(typeof render === 'function') render();
}, (error) => {
  console.error("Bulut bağlantı hatası:", error);
});

// Expose helpers globally for the app UI
window.ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="12" width="8" height="9" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>',
  transactions:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>',
  contacts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c1-4 4-5.5 6.5-5.5S15 16 16 20"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15.5 14.3c2.8.3 5 1.8 5.8 5.4"/></svg>',
  categories:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11.5 3H4v7.5L14 20.5 21 13.5 11.5 3z"/><circle cx="8" cy="7" r="1.3" fill="currentColor" stroke="none"/></svg>',
  recurring:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-14 5.3M4 20v-4h4"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1c.6.5 1.3.9 2 1.2L10 21h4l.5-2.6c.7-.3 1.4-.7 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 4h16"/></svg>',
};

window.fmtMoney = function(n){
  const v = Number(n)||0;
  return v.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' ₺';
};
window.fmtDate = function(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'});
};
window.todayISO = function(){ return new Date().toISOString().slice(0,10); };
window.monthKey = function(iso){ return iso.slice(0,7); };
window.monthLabel = function(key){
  const [y,m] = key.split('-');
  const names=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  return names[parseInt(m,10)-1]+' '+y;
};
window.catById = function(id, type){
  const list = window.state.categories[type]||[];
  return list.find(c=>c.id===id);
};
window.accById = function(id){ return window.state.accounts.find(a=>a.id===id); };
window.contactById = function(id){ return window.state.contacts.find(c=>c.id===id); };
window.escapeHtml = function(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
};

window.accountBalance = function(accId){
  const acc = window.accById(accId); if(!acc) return 0;
  let bal = Number(acc.opening)||0;
  window.state.transactions.forEach(t=>{
    if(t.accountId!==accId) return;
    bal += (t.type==='gelir' ? Number(t.amount) : -Number(t.amount));
  });
  return bal;
};
window.totalBalance = function(){ return window.state.accounts.reduce((s,a)=>s+window.accountBalance(a.id),0); };

window.sumInRange = function(type, startISO, endISO){
  return window.state.transactions
    .filter(t=>t.type===type && t.date>=startISO && t.date<=endISO)
    .reduce((s,t)=>s+Number(t.amount),0);
};
window.txInRange = function(startISO,endISO){
  return window.state.transactions.filter(t=>t.date>=startISO && t.date<=endISO);
};
window.monthRange = function(year,monthIdx0){
  const start = new Date(year,monthIdx0,1);
  const end = new Date(year,monthIdx0+1,0);
  return [start.toISOString().slice(0,10), end.toISOString().slice(0,10)];
};

window.showToast = function(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2400);
};

window.download = function(filename, content, mime){

/* ============================= CHARTS (canvas) ============================= */
function setupHiDPI(canvas, cssW, cssH){
  const ratio = window.devicePixelRatio||1;
  canvas.width = cssW*ratio; canvas.height = cssH*ratio;
  canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(ratio,0,0,ratio,0,0);
  return ctx;
}
function cssVar(name){ return getComputedStyle(document.body).getPropertyValue(name).trim(); }

function drawBarChart(canvas, labels, incomeSeries, expenseSeries){
  const cssW = canvas.parentElement.clientWidth; const cssH = 220;
  const ctx = setupHiDPI(canvas, cssW, cssH);
  ctx.clearRect(0,0,cssW,cssH);
  const padL=40, padB=26, padT=10, padR=10;
  const chartW = cssW-padL-padR, chartH = cssH-padT-padB;
  const maxVal = Math.max(1, ...incomeSeries, ...expenseSeries);
  const niceMax = Math.ceil(maxVal/4)*4 || 1;
  ctx.strokeStyle = cssVar('--border'); ctx.fillStyle = cssVar('--text-faint');
  ctx.font='11px '+getComputedStyle(document.body).fontFamily; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y = padT + chartH - (chartH*i/4);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cssW-padR,y); ctx.globalAlpha=.5; ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillText(Math.round(niceMax*i/4).toLocaleString('tr-TR'), 2, y+3);
  }
  const n = labels.length;
  const groupW = chartW/n;
  const barW = Math.min(16, groupW*0.32);
  labels.forEach((lab,i)=>{
    const cx = padL + groupW*i + groupW/2;
    const ih = (incomeSeries[i]/niceMax)*chartH;
    const eh = (expenseSeries[i]/niceMax)*chartH;
    ctx.fillStyle = cssVar('--income');
    ctx.fillRect(cx-barW-2, padT+chartH-ih, barW, ih);
    ctx.fillStyle = cssVar('--expense');
    ctx.fillRect(cx+2, padT+chartH-eh, barW, eh);
    ctx.fillStyle = cssVar('--text-faint');
    ctx.textAlign='center';
    ctx.fillText(lab, cx, cssH-8);
  });
  ctx.textAlign='left';
}

function drawDonutChart(canvas, dataset){
  const cssW = canvas.parentElement.clientWidth; const cssH = 200;
  const ctx = setupHiDPI(canvas, cssW, cssH);
  ctx.clearRect(0,0,cssW,cssH);
  const total = dataset.reduce((s,d)=>s+d.value,0);
  const cx = cssW/2, cy = cssH/2, rOuter = Math.min(cssW,cssH)/2 - 6, rInner = rOuter*0.6;
  if(total<=0){
    ctx.fillStyle = cssVar('--text-faint'); ctx.textAlign='center'; ctx.font='13px inherit';
    ctx.fillText('Bu dönem için veri yok', cx, cy);
    return;
  }
  let start = -Math.PI/2;
  dataset.forEach(d=>{
    const angle = (d.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,start,start+angle);
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    start += angle;
  });
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2);
  ctx.fillStyle = cssVar('--panel'); ctx.fill();
  ctx.fillStyle = cssVar('--text'); ctx.textAlign='center'; ctx.font='15px '+getComputedStyle(document.body).fontFamily;
  ctx.fillText(fmtMoney(total).replace(',00',''), cx, cy+5);
}

/* ============================= TRANSACTIONS ============================= */
let txFilters = { type:'', categoryId:'', accountId:'', contactId:'', start:'', end:'', q:'' };
let txVisibleCount = 50;

function filteredTx(){
  return window.state.transactions.filter(t=>{
    if(txFilters.type && t.type!==txFilters.type) return false;
    if(txFilters.categoryId && t.categoryId!==txFilters.categoryId) return false;
    if(txFilters.accountId && t.accountId!==txFilters.accountId) return false;
    if(txFilters.contactId && t.contactId!==txFilters.contactId) return false;
    if(txFilters.start && t.date < txFilters.start) return false;
    if(txFilters.end && t.date > txFilters.end) return false;
    if(txFilters.q && !(t.description||'').toLowerCase().includes(txFilters.q.toLowerCase())) return false;
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
}

window.generateRecurring = function(id){
  const r = window.state.recurring.find(x=>x.id===id); if(!r) return;
  const mk = monthKey(todayISO());
  if(window.state.transactions.some(t=>t.recurringId===id && monthKey(t.date)===mk)){ showToast('Bu ay için zaten oluşturulmuş'); return; }
  window.state.transactions.push({ id:uid('tx'), type:r.type, date:todayISO(), amount:r.amount, categoryId:r.categoryId, accountId:r.accountId, contactId:r.contactId||null, description:r.description, recurringId:r.id });
  saveState(); showToast('İşlem oluşturuldu: '+r.description);
};

/* ============================= REPORTS ============================= */
let reportYear = new Date().getFullYear();
function renderReports(root){
  const years = new Set([reportYear]);
  window.state.transactions.forEach(t=>years.add(parseInt(t.date.slice(0,4),10)));
  const yearList = [...years].sort((a,b)=>b-a);

  const monthsInc=[], monthsExp=[], monthLabels=[];
  for(let m=0;m<12;m++){
    const [s,e] = monthRange(reportYear,m);
    monthsInc.push(sumInRange('gelir',s,e));
    monthsExp.push(sumInRange('gider',s,e));
    monthLabels.push(monthLabel(s.slice(0,7)).split(' ')[0]);
  }
  const yearStart = reportYear+'-01-01', yearEnd = reportYear+'-12-31';
  const yearTx = txInRange(yearStart, yearEnd);
  const yearIncome = yearTx.filter(t=>t.type==='gelir').reduce((s,t)=>s+Number(t.amount),0);
  const yearExpense = yearTx.filter(t=>t.type==='gider').reduce((s,t)=>s+Number(t.amount),0);

  const byCat = {};
  yearTx.filter(t=>t.type==='gider').forEach(t=>{ byCat[t.categoryId]=(byCat[t.categoryId]||0)+Number(t.amount); });
  let catData = Object.entries(byCat).map(([id,val])=>{ const c=catById(id,'gider'); return {label:c?c.name:'Diğer',value:val,color:c?c.color:'#9AA0A6'}; }).sort((a,b)=>b.value-a.value);
  if(catData.length>6){ const rest = catData.slice(6).reduce((s,d)=>s+d.value,0); catData = catData.slice(0,6).concat([{label:'Diğer',value:rest,color:'#9AA0A6'}]); }

  root.innerHTML = `
    <div class="filters">
      <select id="rep-year">${yearList.map(y=>`<option value="${y}" ${y===reportYear?'selected':''}>${y}</option>`).join('')}</select>
      <div style="flex:1;"></div>
      <button class="btn btn-sm" id="rep-export">${window.ICONS.download} Yıllık CSV</button>
      <button class="btn btn-sm" id="rep-print">Yazdır</button>
    </div>
    <div class="grid grid-4" style="margin-bottom:16px;">
      <div class="card stat-card income"><div class="label">${reportYear} TOPLAM GELİR</div><div class="value num">${fmtMoney(yearIncome)}</div></div>
      <div class="card stat-card expense"><div class="label">${reportYear} TOPLAM GİDER</div><div class="value num">${fmtMoney(yearExpense)}</div></div>
      <div class="card stat-card"><div class="label">${reportYear} NET KÂR</div><div class="value num" style="color:${yearIncome-yearExpense>=0?'var(--income)':'var(--expense)'}">${fmtMoney(yearIncome-yearExpense)}</div></div>
      <div class="card stat-card"><div class="label">ORTALAMA AYLIK GİDER</div><div class="value num">${fmtMoney(yearExpense/12)}</div></div>
    </div>
    <div class="grid grid-2">
      <div class="card"><h3>Aylık Gelir / Gider (${reportYear})</h3><canvas id="rep-trend"></canvas></div>
      <div class="card"><h3>Yıllık Gider Dağılımı</h3><canvas id="rep-donut"></canvas>
        <div class="legend">${catData.map(d=>`<span class="li"><span class="dot" style="background:${d.color}"></span>${escapeHtml(d.label)} · ${fmtMoney(d.value)}</span>`).join('')}</div>
      </div>
    </div>
  `;
  root.querySelector('#rep-year').addEventListener('change', e=>{ reportYear = parseInt(e.target.value,10); render(); });
  root.querySelector('#rep-export').addEventListener('click',()=>exportTxCSV(yearTx));
  root.querySelector('#rep-print').addEventListener('click',()=>window.print());
  requestAnimationFrame(()=>{
    drawBarChart(document.getElementById('rep-trend'), monthLabels, monthsInc, monthsExp);
    drawDonutChart(document.getElementById('rep-donut'), catData);
  });
}

    if(window.state.accounts.length<=1){ showToast('En az bir hesap bulunmalı'); return; }
    const used = window.state.transactions.some(t=>t.accountId===id);
    if(used){ showToast('Bu hesaba bağlı işlemler var, önce onları taşıyın veya silin'); return; }
    if(confirm('Bu hesabı silmek istiyor musunuz?')){ window.state.accounts = window.state.accounts.filter(a=>a.id!==id); saveState(); showToast('Hesap silindi'); render(); }
  }));
  root.querySelector('#btn-export-json').addEventListener('click',()=>{
    download('RiceMore-Yedek-'+todayISO()+'.json', JSON.stringify(window.state,null,2), 'application/json');
    showToast('Yedek dosyası indirildi');
  });
  root.querySelector('#import-file').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.accounts || !parsed.transactions){ showToast('Geçersiz yedek dosyası'); return; }
        if(confirm('Mevcut tüm veriler bu yedekle değiştirilecek. Devam edilsin mi?')){
          window.state = parsed; saveState(); applyBrand(); showToast('Yedek başarıyla yüklendi'); render();
        }
      }catch(err){ showToast('Dosya okunamadı'); }
    };
    reader.readAsText(file);
  });
  root.querySelector('#btn-reset').addEventListener('click',()=>{
    if(confirm('TÜM veriler kalıcı olarak silinecek. Emin misiniz?')){
      window.state = defaultData(); saveState(); applyBrand(); showToast('Tüm veriler sıfırlandı'); render();
    }
  });
}
function openAccountModal(existing){
  const body = `
    <div class="field"><label>Hesap Adı</label><input type="text" id="acc-name" value="${existing?escapeHtml(existing.name):''}" placeholder="Örn. Kasa"></div>
    <div class="field"><label>Tür</label><select id="acc-type">
      <option value="nakit" ${existing&&existing.type==='nakit'?'selected':''}>Nakit</option>
      <option value="banka" ${existing&&existing.type==='banka'?'selected':''}>Banka</option>
      <option value="kart" ${existing&&existing.type==='kart'?'selected':''}>Kredi Kartı</option>
      <option value="diger" ${existing&&existing.type==='diger'?'selected':''}>Diğer</option>
    </select></div>
    <div class="field"><label>Açılış Bakiyesi (₺)</label><input type="number" step="0.01" id="acc-opening" value="${existing?existing.opening:0}"></div>
  `;
  const foot = `<button class="btn btn-ghost" id="acc-cancel">Vazgeç</button><button class="btn btn-primary" id="acc-save">${existing?'Güncelle':'Kaydet'}</button>`;
  openModal(existing?'Hesabı Düzenle':'Yeni Hesap', body, foot);
  document.getElementById('acc-cancel').addEventListener('click', closeModal);
  document.getElementById('acc-save').addEventListener('click',()=>{
    const name = document.getElementById('acc-name').value.trim();
    if(!name){ showToast('Lütfen hesap adı girin'); return; }
    const data = { name, type:document.getElementById('acc-type').value, opening: parseFloat(document.getElementById('acc-opening').value)||0 };
    if(existing) Object.assign(existing, data);
    else window.state.accounts.push({ id:uid('acc'), ...data });
    saveState(); closeModal(); showToast('Hesap kaydedildi'); render();
  });
}
window.setTheme = function(t){ window.state.settings.theme=t; document.body.setAttribute('data-theme', t); saveState(); render(); };

/* ============================= BRAND / INIT ============================= */
window.applyBrand = function(){
  document.getElementById('brand-name').textContent = window.state.settings.businessName || 'RiceMore';
  document.title = (window.state.settings.businessName||'RiceMore') + ' | Gelir Gider Yönetimi';
  document.body.setAttribute('data-theme', window.state.settings.theme||'dark');
};

document.getElementById('quick-add-btn').addEventListener('click',()=>openTransactionModal(null));

window.applyBrand();
window.navigate('dashboard');
window.addEventListener('resize', ()=>{ if(currentView==='dashboard'||currentView==='reports') window.render(); });
</script>
</body>
